<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>游戏字幕翻译</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>

<!-- 连接页 -->
<div id="join" class="screen">
  <div class="join-card">
    <div class="app-icon">
      <svg viewBox="0 0 64 64" width="40" height="40" fill="none" aria-hidden="true">
        <path d="M14 18a6 6 0 0 1 6-6h24a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H28l-8.5 7A1.6 1.6 0 0 1 17 52.7V42a6 6 0 0 1-3-5.2V18Z" fill="#fff"/>
        <circle cx="24" cy="27" r="2.6" fill="#0071e3"/>
        <circle cx="32" cy="27" r="2.6" fill="#0071e3"/>
        <circle cx="40" cy="27" r="2.6" fill="#0071e3"/>
      </svg>
    </div>
    <h1>游戏字幕翻译</h1>
    <p class="sub">电脑和手机连同一个 WiFi。扫电脑上的二维码，或手动填写地址</p>

    <button id="btn-scan" class="scan-primary" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <path d="M14 14h3v3h-3zM19 19h2v2h-2z"/>
      </svg>
      扫码连接
    </button>
    <p class="scan-hint">用相机拍下电脑端「手机接力」里的二维码，自动识别地址和配对码</p>
    <div class="or"><span>或手动输入</span></div>
    <input id="qr-file" type="file" accept="image/*" capture="environment" hidden>

    <label>中继地址
      <input id="relay-url" type="text" inputmode="url" autocomplete="off" placeholder="ws://192.168.1.5:8780">
    </label>
    <label>配对码
      <input id="pair-code" type="text" inputmode="text" maxlength="8" autocomplete="off" placeholder="电脑上显示的 6 位码">
    </label>
    <button id="btn-join" class="primary">连接</button>
    <button id="btn-install" class="ghost hidden">安装到主屏幕</button>
    <p id="join-status" class="status"></p>
  </div>
</div>

<!-- 字幕页 -->
<div id="chat" class="screen hidden">
  <header>
    <div class="hdr-left">
      <span id="conn-dot" class="dot"></span>
      <span id="pair-tag">--</span>
    </div>
    <div class="hdr-right">
      <button id="btn-font" class="mini" title="字号" aria-label="切换字号">A</button>
      <button id="btn-clear" class="mini" title="清空列表" aria-label="清空">清</button>
      <button id="btn-disconnect" class="mini" title="断开" aria-label="断开">断</button>
    </div>
  </header>

  <div id="modeBanner" class="mode-banner hidden">
    <span class="mode-pulse"></span>
    <div>
      <strong>独占全屏 · 手机字幕</strong>
      <span>PC 字幕条被游戏挡住，译文持续推送到这里</span>
    </div>
  </div>

  <div id="live" class="live-card hidden">
    <div class="live-meta"><span id="liveBadge" class="badge">LIVE</span><span id="liveTime" class="time">--:--</span></div>
    <div id="liveTrans" class="live-trans"></div>
    <div id="liveSrc" class="live-src"></div>
  </div>

  <div id="empty" class="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 64 64" width="56" height="56" fill="none" aria-hidden="true">
        <path d="M14 18a6 6 0 0 1 6-6h24a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H28l-8.5 7A1.6 1.6 0 0 1 17 52.7V42a6 6 0 0 1-3-5.2V18Z" fill="#d2d2d7"/>
        <circle cx="24" cy="27" r="2.6" fill="#fff"/>
        <circle cx="32" cy="27" r="2.6" fill="#fff"/>
        <circle cx="40" cy="27" r="2.6" fill="#fff"/>
      </svg>
    </div>
    等待游戏聊天…<br><span>电脑端开始翻译后，字幕会实时出现在这里</span>
  </div>
  <div id="subtitle-list"></div>

  <!-- 底部操作栏 -->
  <div id="bar">
    <div class="composer">
      <input id="manual-input" type="text" placeholder="手动输入要翻译的话（可选）">
      <button id="btn-send-manual" class="primary small">翻译</button>
    </div>
    <button id="btn-sync-clip" class="mini wide">同步剪贴板</button>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
