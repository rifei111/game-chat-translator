plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rifei.gt'
    compileSdk 33

    defaultConfig {
        applicationId "com.rifei.gt"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
